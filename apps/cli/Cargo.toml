[package]
name = "asciiwall-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[[bin]]
name = "asciiwall"
path = "src/main.rs"

[dependencies]
ascii-core = { path = "../../crates/ascii-core" }
ascii-convert = { path = "../../crates/ascii-convert" }
ascii-media = { path = "../../crates/ascii-media" }
ascii-render = { path = "../../crates/ascii-render" }
clap = { version = "=4.5.50", features = ["derive"] }
ctrlc = "=3.5.1"
serde_json = "=1.0.145"
tempfile = "=3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
