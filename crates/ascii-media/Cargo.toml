[package]
name = "ascii-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[features]
default = ["webp"]
webp = ["dep:image-webp"]

[dependencies]
ascii-core = { path = "../ascii-core" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
image-webp = { version = "=0.2.4", optional = true }
png = { version = "=0.18.0", default-features = false }
zune-core = { version = "=0.5.0", default-features = false, features = ["std"] }
zune-jpeg = { version = "=0.5.5", default-features = false, features = ["std"] }

[dev-dependencies]
mozjpeg = { version = "=0.10.13", default-features = false }
sha2 = "=0.10.9"
